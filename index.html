<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Good Vibes Café</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6ecdc;--bg2:#ead9bf;--card:#fffaf1;--ink:#3b2316;--muted:#7a5c48;--brown:#4a2c1a;--mocha:#6f4528;--caramel:#b9814f;--cream:#fff6e6;--line:#d9c3a3;
--serif:"Fraunces",Georgia,serif;--sans:"DM Sans",system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241409;--bg2:#2f1b0e;--card:#38210f;--ink:#f3e5cf;--muted:#c9ad8d;--line:#583a22}}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px;height:auto}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.05rem/1.65 var(--sans)}
h1,h2,h3{font-family:var(--serif);line-height:1.15;margin:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--caramel);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}
section{padding:92px 0}
h2{font-size:clamp(2rem,4.5vw,3rem);margin-bottom:12px}
.lead{color:var(--muted);max-width:52ch;margin:0 0 40px}
.btn{display:inline-block;border:0;cursor:pointer;font:700 1rem var(--sans);padding:14px 28px;border-radius:999px;background:var(--brown);color:var(--cream);transition:transform .25s,box-shadow .25s,background .25s}
.btn:hover{transform:translateY(-3px);background:var(--mocha);box-shadow:0 10px 24px rgba(74,44,26,.3)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--brown)}
.btn.ghost:hover{background:var(--brown);color:var(--cream)}
/* nav */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;justify-content:space-between;height:70px}
.logo{font:700 1.35rem var(--serif);letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.logo svg{width:28px;height:28px}
.links{display:flex;gap:6px;list-style:none;margin:0;padding:0}
.links a{display:block;padding:8px 14px;border-radius:999px;font-weight:500;transition:background .25s,color .25s}
.links a:hover{background:var(--bg2)}
.links a.active{background:var(--brown);color:var(--cream)}
.burger{display:none;background:none;border:0;width:44px;height:44px;cursor:pointer;color:var(--ink)}
.burger span{display:block;height:2px;background:currentColor;margin:6px 10px;transition:transform .3s,opacity .3s}
.burger.open span:nth-child(1){transform:translateY(8px) rotate(45deg)}
.burger.open span:nth-child(2){opacity:0}
.burger.open span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
/* hero */
.hero{padding:56px 0 80px;background:radial-gradient(circle at 78% 40%,var(--bg2),transparent 60%)}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(2.8rem,7vw,5.2rem);font-weight:700;color:var(--brown)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero h1{color:var(--cream)}}
.hero h1 em{font-style:italic;color:var(--caramel)}
.hero p{color:var(--muted);max-width:46ch;margin:20px 0 32px;font-size:1.15rem}
.cta{display:flex;gap:14px;flex-wrap:wrap}
.hero-art{position:relative;aspect-ratio:1;max-width:520px;margin:auto;width:100%}
.hero-art .disc{position:absolute;inset:6%;border-radius:50%;background:var(--brown);box-shadow:0 30px 60px rgba(74,44,26,.35)}
.hero-art svg{position:absolute;inset:0;width:100%;height:100%;animation:float 6s ease-in-out infinite}
.steam path{stroke-dasharray:60;animation:steam 3.2s ease-in-out infinite;opacity:0}
.steam path:nth-child(2){animation-delay:.8s}.steam path:nth-child(3){animation-delay:1.6s}
@keyframes steam{0%{stroke-dashoffset:60;opacity:0}30%{opacity:.9}100%{stroke-dashoffset:-60;opacity:0;transform:translateY(-14px)}}
@keyframes float{50%{transform:translateY(-10px)}}
/* about */
.about .wrap{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:center;transition:transform .3s}
.stats div:hover{transform:translateY(-5px)}
.stats b{display:block;font:700 1.9rem var(--serif);color:var(--mocha)}
.about-art{background:var(--brown);border-radius:28px;padding:36px;color:var(--cream)}
.about-art h3{font-size:1.6rem;margin-bottom:10px}
.about-art p{margin:0 0 18px;opacity:.9}
/* menu */
.menu{background:var(--bg2)}
.tabs{display:flex;gap:10px;margin-bottom:30px;flex-wrap:wrap}
.tab{border:2px solid var(--brown);background:transparent;color:var(--ink);font:700 .95rem var(--sans);padding:9px 22px;border-radius:999px;cursor:pointer;transition:all .25s}
.tab:hover,.tab.on{background:var(--brown);color:var(--cream)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.item{background:var(--card);border-radius:24px;overflow:hidden;border:1px solid var(--line);transition:transform .35s,box-shadow .35s}
.item:hover{transform:translateY(-8px);box-shadow:0 22px 40px rgba(74,44,26,.2)}
.item .pic{background:linear-gradient(160deg,var(--bg2),var(--line));padding:18px;transition:background .3s}
.item svg{display:block;width:100%;height:170px;transition:transform .45s}
.item:hover svg{transform:scale(1.08) rotate(-3deg)}
.item .info{padding:18px 20px 22px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.item h3{font-size:1.25rem}
.price{font:700 1.2rem var(--serif);color:var(--mocha)}
.item p{margin:6px 0 14px;color:var(--muted);font-size:.95rem}
.add{width:100%;padding:10px}
/* offers */
.offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
.offer{background:var(--brown);color:var(--cream);border-radius:26px;padding:30px;position:relative;overflow:hidden;transition:transform .35s}
.offer:hover{transform:translateY(-6px) rotate(-.6deg)}
.offer:nth-child(2){background:var(--caramel);color:#2c170b}
.offer:nth-child(3){background:var(--card);color:var(--ink);border:2px dashed var(--caramel)}
.offer .big{font:700 3rem var(--serif);line-height:1}
.offer p{margin:10px 0 20px;opacity:.92}
.code{font-weight:700;border:1.5px dashed currentColor;border-radius:10px;padding:4px 12px;display:inline-block;margin-bottom:16px}
.offer .btn{background:var(--cream);color:var(--brown)}
.offer .btn:hover{background:#fff}
/* gallery */
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.gal button{border:0;padding:0;border-radius:22px;overflow:hidden;cursor:pointer;position:relative;aspect-ratio:1;background:none}
.gal button:nth-child(1),.gal button:nth-child(5){grid-row:span 1}
.gal svg{width:100%;height:100%;display:block;transition:transform .5s}
.gal button:hover svg{transform:scale(1.12)}
.gal span{position:absolute;left:0;right:0;bottom:0;padding:34px 16px 14px;color:var(--cream);font:500 1rem var(--serif);text-align:left;background:linear-gradient(transparent,rgba(40,20,8,.78));transform:translateY(100%);transition:transform .35s}
.gal button:hover span,.gal button:focus-visible span{transform:none}
.lb{position:fixed;inset:0;background:rgba(30,15,6,.88);display:none;place-items:center;z-index:50;padding:24px}
.lb.on{display:grid;animation:fade .25s}
.lb div{width:min(520px,90vw);border-radius:24px;overflow:hidden;background:var(--card);text-align:center;padding-bottom:16px}
.lb svg{width:100%;display:block}
.lb p{margin:12px 0 10px;font:500 1.2rem var(--serif)}
@keyframes fade{from{opacity:0}}
/* contact */
.contact{background:var(--bg2)}
.contact .wrap{display:grid;grid-template-columns:1fr 1.15fr;gap:48px}
.info-list{list-style:none;padding:0;margin:0;display:grid;gap:16px}
.info-list li{display:flex;gap:14px;align-items:flex-start}
.info-list i{font-style:normal;background:var(--brown);color:var(--cream);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
form{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:30px;display:grid;gap:16px}
label{font-weight:700;font-size:.92rem;display:grid;gap:6px}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;transition:border-color .25s,box-shadow .25s}
input:focus,textarea:focus{outline:0;border-color:var(--caramel);box-shadow:0 0 0 4px rgba(185,129,79,.25)}
.err{color:#b0301f;font-size:.85rem;font-weight:500;min-height:1em}
@media (prefers-color-scheme:dark){.err{color:#ff9d8a}}
footer{background:var(--brown);color:var(--cream);text-align:center;padding:34px 22px}
footer p{margin:6px 0;opacity:.85}
#top{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;border:0;background:var(--caramel);color:#2c170b;font-size:1.3rem;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:15}
#top.show{opacity:1;pointer-events:auto}#top:hover{transform:translateY(-4px)}
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,120px);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:999px;font-weight:500;transition:transform .4s;z-index:60;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
.rv{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}
.rv.in{opacity:1;transform:none}
@media (max-width:860px){
 section{padding:70px 0}
 .hero .wrap,.about .wrap,.contact .wrap{grid-template-columns:1fr}
 .hero-art{max-width:380px;order:-1}
 .burger{display:block}
 .links{position:absolute;top:70px;left:0;right:0;flex-direction:column;background:var(--bg);padding:12px 22px 20px;border-bottom:1px solid var(--line);transform:translateY(-12px);opacity:0;pointer-events:none;transition:all .3s}
 .links.open{transform:none;opacity:1;pointer-events:auto}
 .gal{grid-template-columns:repeat(2,1fr)}
}
/* 3D upgrade */
.gal img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}.gal button:hover img{transform:scale(1.1)}.lb img{width:100%;max-height:70vh;object-fit:cover;display:block}
@media (hover:hover) and (pointer:fine){html.cc,html.cc a,html.cc button,html.cc .tab,html.cc .gal button,html.cc .item{cursor:none}html.cc input,html.cc textarea{cursor:text}}
.cur-dot,.cur-ring{position:fixed;left:0;top:0;pointer-events:none;z-index:200;border-radius:50%;opacity:0}
.cur-dot{width:8px;height:8px;margin:-4px 0 0 -4px;background:var(--caramel);transition:opacity .3s}
.cur-ring{width:38px;height:38px;margin:-19px 0 0 -19px;border:2px solid var(--caramel);transition:width .25s,height .25s,margin .25s,background .25s,opacity .3s}
.cur-ring.hov{width:64px;height:64px;margin:-32px 0 0 -32px;background:rgba(185,129,79,.2)}
.cur-ring.dn{width:24px;height:24px;margin:-12px 0 0 -12px;background:rgba(185,129,79,.35)}
.cur-on .cur-dot,.cur-on .cur-ring{opacity:1}
.clk{position:fixed;pointer-events:none;z-index:199;border-radius:50%}
.rip{width:20px;height:20px;margin:-10px 0 0 -10px;border:2px solid var(--caramel);animation:rip .7s ease-out forwards}
@keyframes rip{to{transform:scale(5);opacity:0}}
.bn{width:9px;height:13px;margin:-6px 0 0 -4px;background:radial-gradient(circle at 30% 30%,#8a5a37,#3b2316);animation:bn .8s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes bn{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.ld{display:grid;justify-items:center;gap:16px;perspective:500px}.ld b{font:700 1.6rem var(--serif)}.bean3d{width:64px;animation:spinY 1.5s linear infinite}@keyframes spinY{to{transform:rotateY(360deg)}}
.bar{width:130px;height:3px;border-radius:3px;background:rgba(255,246,230,.25);position:relative;overflow:hidden}.bar::after{content:"";position:absolute;inset:0;background:var(--caramel);transform:translateX(-100%);animation:ldb 1.4s ease-in-out forwards}@keyframes ldb{to{transform:none}}
.pdiv{position:relative;height:96px;margin:-20px 0;overflow:hidden;pointer-events:none}
.pdiv .st{position:absolute;left:50%;top:0;width:6px;margin-left:-3px;height:0;border-radius:3px;background:linear-gradient(#6f4528,#3b2316)}
.pdiv.in .st{animation:pst 1.5s ease-in forwards}@keyframes pst{0%{height:0;top:0}45%{height:72px;top:0}100%{height:0;top:72px}}
.pdiv .pl{position:absolute;left:0;right:0;top:70px;height:12px;border-radius:12px;background:linear-gradient(90deg,transparent,#4a2c1a 15%,#6f4528 50%,#4a2c1a 85%,transparent);box-shadow:0 6px 14px rgba(74,44,26,.25);transform:scaleX(0);transition:transform 1.2s cubic-bezier(.2,.8,.2,1) .6s}

.band{position:relative;height:clamp(260px,42vw,380px);overflow:hidden;display:grid;place-items:center;text-align:center;color:var(--cream)}

.bq{position:relative;z-index:1;padding:0 22px}.bq p{font:500 clamp(1.6rem,4.4vw,2.9rem)/1.2 var(--serif);margin:0 auto 22px;max-width:20ch}.bq .btn{background:var(--caramel);color:#2c170b;box-shadow:0 0 0 rgba(185,129,79,0)}.bq .btn:hover{background:#d4a06a;box-shadow:0 0 28px rgba(185,129,79,.7)}
.reviews{background:var(--brown);color:var(--cream)}.reviews .lead{color:#d9c3a3}
.rslider{overflow:hidden;max-width:760px;margin:0 auto;touch-action:pan-y}.rtrack{display:flex;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.rc{flex:0 0 100%;padding:6px}.rc>div{background:rgba(255,246,230,.08);border:1px solid rgba(255,246,230,.2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:26px;padding:36px 28px;text-align:center}
.rc q{display:block;font:500 1.2rem/1.65 var(--serif);quotes:none}.stars{color:var(--caramel);letter-spacing:4px;margin:0 0 14px}.rc b{display:block;margin-top:20px}.rc small{opacity:.7}
.rctl{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:22px}
.rb{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--caramel);background:transparent;color:var(--cream);font-size:1.2rem;cursor:pointer;transition:all .25s}.rb:hover{background:var(--caramel);color:#2c170b;box-shadow:0 0 22px rgba(185,129,79,.6)}
.rdots{display:flex;gap:8px}.rdots button{width:9px;height:9px;padding:0;border:0;border-radius:50%;background:rgba(255,246,230,.3);cursor:pointer;transition:all .3s}.rdots button.on{width:26px;border-radius:6px;background:var(--caramel)}
footer.ft{text-align:left;padding:64px 0 26px}.fg{display:grid;grid-template-columns:1.4fr 1fr 1.2fr .7fr;gap:36px}.ft h3{font-size:1.1rem;margin-bottom:12px;color:var(--caramel)}.ft p{margin:0 0 10px;opacity:.88}.ft a{transition:color .25s}.ft a:hover{color:var(--caramel)}.ft .logo{margin-bottom:12px}
.ig{display:inline-flex;gap:10px;align-items:center;border:1.5px solid var(--caramel);padding:9px 18px;border-radius:999px;margin-top:6px;transition:all .25s}.ig:hover{background:var(--caramel);color:#2c170b!important;box-shadow:0 0 22px rgba(185,129,79,.6)}
.copy{text-align:center;border-top:1px solid rgba(255,246,230,.18);margin-top:38px!important;padding-top:22px;font-size:.9rem}
@media (max-width:860px){.fg{grid-template-columns:1fr 1fr}}@media (max-width:520px){.fg{grid-template-columns:1fr}}
.hero-art.photo{aspect-ratio:1000/667;max-width:600px;perspective:none}.hero-art.photo .frame{position:absolute;inset:0;border-radius:28px;overflow:hidden;box-shadow:0 30px 60px rgba(74,44,26,.35)}
.zoom{position:absolute;inset:0;transform-origin:50% 45%;animation:kb 20s ease-in-out infinite alternate}@keyframes kb{to{transform:scale(1.1)}}
.bgp{position:absolute;inset:-2%;width:104%;height:104%;object-fit:cover;translate:calc(var(--mx,0)*-8px) calc(var(--my,0)*-6px);transition:translate .35s ease-out}
